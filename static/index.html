<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Agent Admin</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2e3144;
    --accent: #4f8ef7;
    --accent-hover: #3a7de6;
    --danger: #e05263;
    --warn: #f0a443;
    --success: #4caf86;
    --text: #e2e4ec;
    --muted: #7b7f94;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

  /* Layout */
  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 0; flex-shrink: 0; }
  #main { flex: 1; padding: 32px 36px; overflow-y: auto; }

  /* Sidebar */
  .sidebar-header { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-header h2 { font-size: 16px; font-weight: 700; }
  .sidebar-header small { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; word-break: break-all; }
  nav { flex: 1; padding: 10px 0; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--muted); text-decoration: none; font-size: 13px; cursor: pointer; transition: all .15s; }
  nav a:hover, nav a.active { color: var(--text); background: var(--surface2); }
  nav a.active { border-left: 3px solid var(--accent); padding-left: 15px; }
  .sidebar-actions { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .sidebar-actions button { flex: 1; }

  /* Auth screen */
  #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; width: 380px; }
  .login-card h1 { font-size: 22px; margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* Forms */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
  input[type=text], input[type=email], input[type=password], input[type=number], textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); padding: 9px 12px; font-size: 14px; transition: border .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; font-family: inherit; }
  select option { background: var(--surface2); }

  /* Buttons */
  button, .btn { cursor: pointer; border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger  { background: var(--danger); color: #fff; }
  .btn-danger:hover  { background: #c0394a; }
  .btn-ghost  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-warn { background: var(--warn); color: #000; }
  .btn-success { background: var(--success); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-full { width: 100%; margin-top: 12px; }

  /* Cards / expanders */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .expander { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .expander-header { background: var(--surface); padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; user-select: none; }
  .expander-header:hover { background: var(--surface2); }
  .expander-body { background: var(--bg); padding: 18px; display: none; border-top: 1px solid var(--border); }
  .expander-body.open { display: block; }
  .chevron { transition: transform .2s; font-size: 12px; color: var(--muted); }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .metric .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .metric .value { font-size: 28px; font-weight: 700; margin-top: 4px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:last-child td { border-bottom: none; }

  /* Alerts */
  .alert { padding: 12px 16px; border-radius: 8px; margin: 10px 0; font-size: 13px; }
  .alert-success { background: rgba(76,175,134,.15); border: 1px solid rgba(76,175,134,.3); color: var(--success); }
  .alert-error   { background: rgba(224,82,99,.15); border: 1px solid rgba(224,82,99,.3); color: var(--danger); }
  .alert-info    { background: rgba(79,142,247,.12); border: 1px solid rgba(79,142,247,.3); color: var(--accent); }

  /* Query type pills */
  .qt-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .qt-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; }
  .qt-pill.builtin { border-color: rgba(79,142,247,.4); color: var(--accent); }
  .qt-pill.custom  { border-color: rgba(76,175,134,.4); color: var(--success); }
  .qt-pill .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; padding: 0; font-size: 13px; line-height: 1; }

  /* Misc */
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
  h2 { font-size: 18px; font-weight: 600; margin: 20px 0 12px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(240,164,67,.2); color: var(--warn); margin-left: 8px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast-item { padding: 12px 18px; border-radius: 9px; font-size: 13px; font-weight: 500; animation: fadeIn .2s; max-width: 320px; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" style="display:none">
  <div class="login-card">
    <h1>✉️ Email Agent</h1>
    <p>Sign in with your admin account</p>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <label>Email Address</label>
    <input type="email" id="login-email" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="login-password" />
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>✉️ Email Agent</h2>
      <small id="sidebar-user"></small>
    </div>
    <nav>
      <a onclick="navigate('dashboard')"   id="nav-dashboard">📊 Dashboard</a>
      <a onclick="navigate('approvals')"   id="nav-approvals">⏳ Pending Approvals</a>
      <a onclick="navigate('manual')"      id="nav-manual">🔁 Manual Queue</a>
      <a onclick="navigate('sent')"        id="nav-sent">✅ Sent Emails</a>
      <a onclick="navigate('templates')"   id="nav-templates">📋 Templates</a>
      <a onclick="navigate('settings')"    id="nav-settings">⚙️ Settings</a>
    </nav>
    <div class="sidebar-actions">
      <button class="btn btn-ghost btn-sm" onclick="pollNow()">🔄 Poll</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">🚪 Out</button>
    </div>
  </div>
  <div id="main">
    <div id="page-content" class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let currentPage = 'dashboard';
let currentUser = null;
let _queryTypeCache = [];

// ── Security: HTML escaping ───────────────────────────────────────────────────
// IMPORTANT: Every value that originates from user-controlled data (email
// addresses, subjects, bodies, log details, template content, etc.) MUST be
// passed through esc() before being interpolated into an innerHTML string.
// Never bypass this with a cast or a comment; if a value can come from the
// network it must be escaped.
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;');
}

// Safe DOM text setter — avoids innerHTML for single text nodes.
function setText(el, value) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (el) el.textContent = value;
}

// ── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) { showAuth(); return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.style.background = type === 'success' ? 'rgba(76,175,134,.9)' : type === 'error' ? 'rgba(224,82,99,.9)' : 'rgba(79,142,247,.9)';
  el.style.color = type === 'warn' ? '#000' : '#fff';
  // Use textContent — toast messages are developer-controlled strings only
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Auth ─────────────────────────────────────────────────────────────────────
async function init() {
  const user = await api('GET', '/auth/me').catch(() => null);
  if (user) { currentUser = user; showApp(); }
  else { showAuth(); }
}

function showAuth() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // Use textContent — never innerHTML — for user-supplied email address
  setText('sidebar-user', currentUser?.email || '');
  navigate('dashboard');
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const user = await api('POST', '/auth/login', {
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value,
    });
    if (user) { currentUser = { email: user.user_email }; showApp(); }
  } catch(e) {
    // Use textContent to display the error message safely
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function doLogout() {
  await api('POST', '/auth/logout').catch(() => {});
  currentUser = null; showAuth();
}

// ── Navigation ───────────────────────────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + page);
  if (el) el.classList.add('active');
  renderPage(page);
}

function renderPage(page) {
  const content = document.getElementById('page-content');
  content.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
  const pages = { dashboard, approvals, manualQueue, sentEmails, templates, settings };
  const fn = pages[page === 'manual' ? 'manualQueue' : page === 'sent' ? 'sentEmails' : page];
  if (fn) fn();
}

// ── Poll Now ─────────────────────────────────────────────────────────────────
async function pollNow() {
  try {
    await api('POST', '/settings/run-pipeline');
    toast('Inbox polled!');
    if (currentPage === 'dashboard') dashboard();
  } catch(e) { toast(e.message, 'error'); }
}

// ── DOM builder helpers ──────────────────────────────────────────────────────
// These create elements via the DOM API (not innerHTML) for any slot that
// contains untrusted data.  innerHTML is only used for static chrome where
// every interpolated value has been passed through esc().

function makeTextarea(id, value, rows, disabled) {
  const ta = document.createElement('textarea');
  ta.id = id;
  ta.rows = rows || 6;
  ta.value = value || '';
  if (disabled) { ta.disabled = true; ta.style.opacity = '0.7'; }
  return ta;
}

function makeInput(id, value, type) {
  const inp = document.createElement('input');
  inp.type = type || 'text';
  inp.id = id;
  inp.value = value || '';
  return inp;
}

// ══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
async function dashboard() {
  const data = await api('GET', '/dashboard');
  if (!data) return;
  const c = document.getElementById('page-content');

  // Metrics are numeric — safe to interpolate directly
  c.innerHTML = `
    <h1>Dashboard</h1>
    <div class="metrics">
      <div class="metric"><div class="label">📥 Received Today</div><div class="value">${parseInt(data.received_today)||0}</div></div>
      <div class="metric"><div class="label">⏳ Pending</div><div class="value">${parseInt(data.pending)||0}</div></div>
      <div class="metric"><div class="label">⏰ Scheduled</div><div class="value">${parseInt(data.approved)||0}</div></div>
      <div class="metric"><div class="label">✅ Sent</div><div class="value">${parseInt(data.sent)||0}</div></div>
      <div class="metric"><div class="label">🔁 Manual Queue</div><div class="value">${parseInt(data.manual_queue)||0}</div></div>
      <div class="metric"><div class="label">⏱ Avg Response (min)</div><div class="value">${parseFloat(data.avg_response_min)||0}</div></div>
    </div>
    <hr class="divider">
    <h2>Recent Activity</h2>
    <div id="activity-container"></div>
  `;

  // Build activity table via DOM to avoid XSS from log detail/action fields
  const container = document.getElementById('activity-container');
  if (!data.recent_activity || !data.recent_activity.length) {
    container.innerHTML = '<div class="alert alert-info">No activity yet. Click Poll to fetch emails.</div>';
    return;
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'card';
  wrapper.style.cssText = 'padding:0;overflow:hidden';

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Time</th><th>Action</th><th>Detail</th></tr></thead>';
  const tbody = document.createElement('tbody');

  for (const r of data.recent_activity) {
    const tr = document.createElement('tr');
    const tdTime = document.createElement('td');
    tdTime.className = 'muted';
    tdTime.textContent = r.time || '';

    const tdAction = document.createElement('td');
    tdAction.textContent = r.action || '';

    const tdDetail = document.createElement('td');
    tdDetail.textContent = r.detail || '';

    tr.append(tdTime, tdAction, tdDetail);
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  wrapper.appendChild(table);
  container.appendChild(wrapper);
}

// ══════════════════════════════════════════════════════════════════════════════
// PENDING APPROVALS
// ══════════════════════════════════════════════════════════════════════════════
async function approvals() {
  const data = await api('GET', '/approvals');
  if (!data) return;
  const c = document.getElementById('page-content');

  if (!data.length) {
    c.innerHTML = '<h1>Pending Approvals</h1><div class="alert alert-success">All caught up — no drafts waiting.</div>';
    return;
  }

  c.innerHTML = `<h1>Pending Approvals</h1><p style="margin-bottom:16px;color:var(--muted)">${data.length} draft(s) awaiting review</p><div id="approvals-list"></div>`;
  const list = document.getElementById('approvals-list');

  for (const item of data) {
    const { draft, email, delay_badge } = item;
    const conf = Math.round((draft.confidence || 0) * 100);
    const body = draft.edited_body || draft.draft_body || '';

    // ── Outer expander shell (static chrome — no user data here) ─────────
    const expander = document.createElement('div');
    expander.className = 'expander';
    expander.id = `exp-${draft.id}`;

    // ── Header — user-controlled fields go in via textContent ─────────────
    const header = document.createElement('div');
    header.className = 'expander-header';
    header.onclick = () => toggleExp(draft.id);

    const headerLeft = document.createElement('span');
    // Build header text safely
    const senderStrong = document.createElement('strong');
    senderStrong.textContent = email.sender;
    headerLeft.appendChild(document.createTextNode('📧 '));
    headerLeft.appendChild(senderStrong);
    headerLeft.appendChild(document.createTextNode(` | ${esc(email.subject || '(no subject)')} | Type: ${esc(email.query_type || 'unknown')} | ${conf}% confidence`));
    if (delay_badge) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = `⏰ ${delay_badge}`;
      headerLeft.appendChild(badge);
    }

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.id = `chev-${draft.id}`;
    chevron.textContent = '▼';
    chevron.style.transform = 'rotate(180deg)';

    header.append(headerLeft, chevron);

    // ── Body ──────────────────────────────────────────────────────────────
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'expander-body open';
    bodyDiv.id = `exp-body-${draft.id}`;

    // Two-column layout
    const twocol = document.createElement('div');
    twocol.className = 'two-col';

    const leftCol = document.createElement('div');
    const leftLabel = document.createElement('label');
    leftLabel.textContent = 'Original Email';
    const origTa = makeTextarea(`orig-${draft.id}`, email.body || '', 8, true);
    const receivedP = document.createElement('p');
    receivedP.className = 'muted';
    receivedP.style.marginTop = '6px';
    receivedP.textContent = `Received: ${(email.received_at || '').slice(0, 16).replace('T', ' ')}`;
    leftCol.append(leftLabel, origTa, receivedP);

    const rightCol = document.createElement('div');
    const rightLabel = document.createElement('label');
    rightLabel.textContent = 'AI Draft Response (editable)';
    const draftTa = makeTextarea(`draft-body-${draft.id}`, body, 8, false);
    rightCol.append(rightLabel, draftTa);

    twocol.append(leftCol, rightCol);

    // Action row
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '14px';

    if (delay_badge) {
      const btnSchedule = document.createElement('button');
      btnSchedule.className = 'btn btn-primary';
      btnSchedule.textContent = `⏰ Approve & Schedule (${delay_badge})`;
      btnSchedule.onclick = () => approveDraft(draft.id, false);

      const btnImmediate = document.createElement('button');
      btnImmediate.className = 'btn btn-success';
      btnImmediate.style.background = 'var(--success)';
      btnImmediate.textContent = '⚡ Send Immediately';
      btnImmediate.onclick = () => approveDraft(draft.id, true);

      row.append(btnSchedule, btnImmediate);
    } else {
      const btnApprove = document.createElement('button');
      btnApprove.className = 'btn btn-primary';
      btnApprove.textContent = '✅ Approve & Send';
      btnApprove.onclick = () => approveDraft(draft.id, false);
      row.appendChild(btnApprove);
    }

    const btnSave = document.createElement('button');
    btnSave.className = 'btn btn-ghost';
    btnSave.textContent = '♻️ Save Edits';
    btnSave.onclick = () => saveEdits(draft.id);

    const rejectInput = makeInput(`reject-note-${draft.id}`, '', 'text');
    rejectInput.placeholder = 'Reject reason (optional)';
    rejectInput.style.cssText = 'flex:1;min-width:180px';

    const btnReject = document.createElement('button');
    btnReject.className = 'btn btn-danger';
    btnReject.textContent = '❌ Reject';
    btnReject.onclick = () => rejectDraft(draft.id);

    row.append(btnSave, rejectInput, btnReject);

    const msgDiv = document.createElement('div');
    msgDiv.id = `approval-msg-${draft.id}`;

    bodyDiv.append(twocol, row, msgDiv);
    expander.append(header, bodyDiv);
    list.appendChild(expander);
  }
}

function toggleExp(id) {
  const body = document.getElementById(`exp-body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const open = body.classList.toggle('open');
  if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
}

async function approveDraft(id, force_immediate) {
  const bodyVal = document.getElementById(`draft-body-${id}`).value;
  const msgEl = document.getElementById(`approval-msg-${id}`);
  try {
    await api('POST', `/approvals/${id}/approve`, { body: bodyVal, force_immediate });
    toast(force_immediate ? '⚡ Sent immediately!' : '✅ Approved!');
    approvals();
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function saveEdits(id) {
  const bodyVal = document.getElementById(`draft-body-${id}`).value;
  const msgEl = document.getElementById(`approval-msg-${id}`);
  try {
    await api('POST', `/approvals/${id}/save`, { body: bodyVal });
    msgEl.innerHTML = '<div class="alert alert-info">Edits saved.</div>';
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function rejectDraft(id) {

    const btnSend = document.createElement('button');

function toggleMExp(id) {

// ══════════════════════════════════════════════════════════════════════════════
// TEMPLATES  (with custom query type management)
// ══════════════════════════════════════════════════════════════════════════════
async function templates() {
  const [tmplData, qtData] = await Promise.all([
    api('GET', '/templates'),
    api('GET', '/templates/query-types'),
  ]);
  if (!tmplData || !qtData) return;

  _queryTypeCache = qtData.map(q => q.name);

  const c = document.getElementById('page-content');

  // ── Existing templates HTML (template name/query_type are admin-created,
  //    but still escaped for defence-in-depth) ──────────────────────────────
  const tmplHtml = tmplData.map(t => {
    const delay = t.send_delay_seconds || 0;
    let initUnit = 'Minutes', initVal = 0;
    if (delay >= 86400 && delay % 86400 === 0) { initUnit = 'Days'; initVal = delay / 86400; }
    else if (delay >= 3600 && delay % 3600 === 0) { initUnit = 'Hours'; initVal = delay / 3600; }
    else if (delay > 0) { initUnit = 'Minutes'; initVal = Math.floor(delay / 60); }

    return `
    <div class="expander">
      <div class="expander-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.chevron').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''">
        <span>📋 <strong>${esc(t.name)}</strong> &nbsp;|&nbsp; Type: ${esc(t.query_type||'')}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="expander-body">
        <label>Subject</label>
        <input type="text" id="ts-${t.id}" value="${esc(t.subject||'')}">
        <label>Body</label>
        <textarea rows="6" id="tb-${t.id}">${esc(t.body||'')}</textarea>
        <label style="margin-top:14px">Send Delay After Approval</label>
        <div class="three-col" style="margin-top:4px">
          <div>
            <label>Amount</label>
            <input type="number" id="tdv-${t.id}" min="0" value="${parseInt(initVal)||0}">
          </div>
          <div>
            <label>Unit</label>
            <select id="tdu-${t.id}">
              <option ${initUnit==='Minutes'?'selected':''}>Minutes</option>
              <option ${initUnit==='Hours'?'selected':''}>Hours</option>
              <option ${initUnit==='Days'?'selected':''}>Days</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <span class="muted" id="tdc-${t.id}">${esc(delayCaption(initVal, initUnit))}</span>
          </div>
        </div>
        <div id="tmpl-msg-${t.id}" style="margin-top:8px"></div>
        <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="saveTemplate(${parseInt(t.id)})">Save</button>
      </div>
    </div>`;
  }).join('');

  // ── Query type pills ──────────────────────────────────────────────────────
  // Pills are built via DOM to prevent XSS in custom query type names/keywords
  c.innerHTML = `
    <h1>Response Templates</h1>
    <p class="muted" style="margin-bottom:16px">Use <code>{{ai_response}}</code> and <code>{{customer_name}}</code> as placeholders.</p>
    ${tmplHtml}
    <hr class="divider">
    <h2>📂 Query Type Manager</h2>
    <p class="muted" style="margin-bottom:12px">
      🔒 Built-in types cannot be deleted. ✏️ Custom types are user-defined.<br>
      You can add keywords to any type to improve the AI keyword-fallback classifier.
    </p>
    <div class="qt-list" id="qt-pill-list"></div>
    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0;margin-bottom:14px;font-size:15px">Add / Update Query Type</h2>
      <div class="two-col">
        <div>
          <label>Query Type Name</label>
          <input type="text" id="qt-name" placeholder="e.g. warranty, partnership, shipping…">
          <p class="hint">Lowercase letters, numbers and hyphens only. Built-in names are allowed (to add keywords).</p>
        </div>
        <div>
          <label>Keywords (optional)</label>
          <input type="text" id="qt-keywords" placeholder="e.g. warranty, broken, defective, replacement">
          <p class="hint">Comma-separated words/phrases. Used as fallback if AI classification fails.</p>
        </div>
      </div>
      <div id="qt-msg" style="margin-top:8px"></div>
      <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="saveQueryType()">💾 Save Query Type</button>
    </div>
    <hr class="divider">
    <h2>Add New Template</h2>
    <div class="card">
      <label>Name (unique)</label><input type="text" id="n-name">
      <label>Query Type</label>
      <input type="text" id="n-type" placeholder="Type or choose — e.g. billing, warranty…" list="qt-datalist">
      <datalist id="qt-datalist"></datalist>
      <p class="hint">Type a query type name. All types (built-in + custom) are suggested.</p>
      <label>Subject Line</label><input type="text" id="n-subj">
      <label>Body</label><textarea rows="5" id="n-body"></textarea>
      <label style="margin-top:14px">Send Delay After Approval</label>
      <div class="two-col">
        <div><label>Amount</label><input type="number" id="n-dv" min="0" value="0"></div>
        <div><label>Unit</label><select id="n-du"><option>Minutes</option><option>Hours</option><option>Days</option></select></div>
      </div>
      <div id="new-tmpl-msg" style="margin-top:8px"></div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="createTemplate()">Create Template</button>
    </div>`;

  // Build pills via DOM
  const pillList = document.getElementById('qt-pill-list');
  for (const q of qtData) {
    const pill = document.createElement('span');
    pill.className = `qt-pill ${q.is_builtin ? 'builtin' : 'custom'}`;

    const icon = document.createTextNode(q.is_builtin ? '🔒 ' : '✏️ ');
    const nameTxt = document.createTextNode(q.name);
    pill.append(icon, nameTxt);

    if (q.keywords) {
      const kws = q.keywords.split(',').slice(0, 3).map(k => k.trim()).join(', ');
      const kwSpan = document.createElement('span');
      kwSpan.style.cssText = 'opacity:.6;font-size:10px';
      kwSpan.textContent = ` · ${kws}${q.keywords.split(',').length > 3 ? '…' : ''}`;
      pill.appendChild(kwSpan);
    }

    if (!q.is_builtin) {
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.title = 'Delete';
      del.textContent = '✕';
      // Store name as data attribute to avoid closure over loop variable
      del.dataset.name = q.name;
      del.onclick = function() { deleteQueryType(this.dataset.name); };
      pill.appendChild(del);
    }

    pillList.appendChild(pill);
  }

  // Build datalist options safely
  const datalist = document.getElementById('qt-datalist');
  for (const name of _queryTypeCache) {
    const opt = document.createElement('option');
    opt.value = name;
    datalist.appendChild(opt);
  }
}

function delayCaption(val, unit) {
  if (!val || val == 0) return '⚡ Send immediately';
  return `⏰ Send ${val} ${unit.toLowerCase()} after approval`;
}

async function saveTemplate(id) {
  const subject = document.getElementById(`ts-${id}`).value;
  const body = document.getElementById(`tb-${id}`).value;
  const val = parseInt(document.getElementById(`tdv-${id}`).value) || 0;
  const unit = document.getElementById(`tdu-${id}`).value;
  const mult = { Minutes: 60, Hours: 3600, Days: 86400 }[unit];
  const delay = val > 0 ? val * mult : null;
  const msgEl = document.getElementById(`tmpl-msg-${id}`);
  try {
    await api('PUT', `/templates/${id}`, { subject, body, send_delay_seconds: delay });
    msgEl.innerHTML = '<div class="alert alert-success">Template saved.</div>';
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function createTemplate() {
  const name = document.getElementById('n-name').value.trim();
  const query_type = document.getElementById('n-type').value.trim().toLowerCase();
  const subject = document.getElementById('n-subj').value;
  const body = document.getElementById('n-body').value;
  const val = parseInt(document.getElementById('n-dv').value) || 0;
  const unit = document.getElementById('n-du').value;
  const mult = { Minutes: 60, Hours: 3600, Days: 86400 }[unit];
  const delay = val > 0 ? val * mult : null;
  const msgEl = document.getElementById('new-tmpl-msg');

  if (!name || !query_type) {
    msgEl.innerHTML = '<div class="alert alert-error">Template name and query type are required.</div>';
    return;
  }

  try {
    await api('POST', '/templates', { name, query_type, subject, body, send_delay_seconds: delay });
    toast('Template created!');
    templates();
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function saveQueryType() {
  const name = document.getElementById('qt-name').value.trim().toLowerCase();
  const keywords = document.getElementById('qt-keywords').value.trim();
  const msgEl = document.getElementById('qt-msg');

  if (!name) {
    msgEl.innerHTML = '<div class="alert alert-error">Query type name cannot be empty.</div>';
    return;
  }
  if (!/^[a-z0-9_-]+$/.test(name)) {
    msgEl.innerHTML = '<div class="alert alert-error">Use only lowercase letters, numbers, hyphens or underscores.</div>';
    return;
  }

  try {
    await api('POST', '/templates/query-types', { name, keywords });
    toast(`Query type "${name}" saved!`);
    document.getElementById('qt-name').value = '';
    document.getElementById('qt-keywords').value = '';
    templates();
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function deleteQueryType(name) {
  if (!confirm(`Delete custom query type "${name}"?\n\nThis removes it from the classifier and suggestion list but does NOT delete templates that already use it.`)) return;
  try {
    await api('DELETE', `/templates/query-types/${encodeURIComponent(name)}`);
    toast(`Query type "${name}" deleted.`, 'warn');
    templates();
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function saveSettings() {
  const keys = ['EMAIL_ADDRESS','EMAIL_PASSWORD','IMAP_HOST','IMAP_PORT','IMAP_SENT_FOLDER','SMTP_HOST','SMTP_PORT','SMTP_MODE','POLL_INTERVAL_SECONDS','MAX_REPEAT_COUNT','GEMINI_MODEL'];

  keys.forEach(k => {
    const el = document.getElementById('s-' + k);
    if (el) settingsPayload[k] = el.value;
  });
  const msgEl = document.getElementById('settings-msg');
  try {
    await api('POST', '/settings', { settings: settingsPayload });
    msgEl.innerHTML = '<div class="alert alert-success">✅ Settings saved!</div>';
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function testSmtp() {
  const msgEl = document.getElementById('smtp-test-msg');
  msgEl.innerHTML = '<span class="spinner"></span> Testing…';
  const pw = document.getElementById('s-EMAIL_PASSWORD').value;
  try {
    const res = await api('POST', '/settings/test-smtp', {
      host: document.getElementById('s-SMTP_HOST').value,
      port: parseInt(document.getElementById('s-SMTP_PORT').value),
      mode: document.getElementById('s-SMTP_MODE').value,
      address: document.getElementById('s-EMAIL_ADDRESS').value,
      password: pw !== '••••••••' ? pw : '',
    });
    msgEl.innerHTML = '<div class="alert alert-success"></div>';
    msgEl.firstChild.textContent = res.detail;
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

async function runPipeline() {
  const msgEl = document.getElementById('smtp-test-msg');
  msgEl.innerHTML = '<span class="spinner"></span> Running pipeline…';
  try {
    await api('POST', '/settings/run-pipeline');
    msgEl.innerHTML = '<div class="alert alert-success">Pipeline complete.</div>';
  } catch(e) {
    msgEl.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = 'alert alert-error';
    alert.textContent = e.message;
    msgEl.appendChild(alert);
  }
}

init();
</script>
